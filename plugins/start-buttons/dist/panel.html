<html lang="zh-CN">

  <title>项目启动台</title>

  <style>:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  --bg: #f5f5f7;
  --surface: #fff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #e5e5ea;
  --soft: #f5f5f7;
  --hover: #ededf0;
  --accent: #0071e3;
  --accent-hover: #0066cc;
  --accent-text: #0071e3;
  --accent-soft: #edf5ff;
  --success: #24834b;
  --success-soft: #eef8f1;
  --warning: #98651b;
  --warning-soft: #fbf4e8;
  --error: #b4232c;
  --error-soft: #fff1f2;
  --shadow: 0 4px 24px #1d1d1f05, 0 1px 3px #1d1d1f03;
  --shadow-hover: 0 12px 32px #1d1d1f0a, 0 2px 6px #1d1d1f04;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
input:focus, textarea:focus, select:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.shell { width: min(100%, 1120px); margin: 0 auto; padding: 40px 32px 28px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark { width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; }
.brand h1 { margin: 0; color: var(--text); font-size: 23px; font-weight: 650; line-height: 1.25; letter-spacing: -.6px; }
.version { color: var(--muted); font-size: 11px; font-weight: 500; align-self: center; margin-left: 1px; }
.primary, .secondary, .danger { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 12px; padding: 11px 18px; font-size: 13px; font-weight: 550; line-height: 1.5; transition: background .18s ease, box-shadow .18s ease; }
.primary { color: #fff; background: var(--accent); }
.primary:hover:not(:disabled) { background: var(--accent-hover); }
.primary:disabled { opacity: .5; }
.secondary { color: var(--text); background: var(--soft); }
.secondary:hover:not(:disabled) { background: var(--hover); }
.secondary:disabled { color: var(--muted); opacity: .5; }
.danger { color: var(--error); background: transparent; }
.danger:hover:not(:disabled) { background: var(--error-soft); }
.action-icon { width: 16px; height: 16px; flex-shrink: 0; }
.action-icon svg { display: block; width: 100%; height: 100%; }
.status-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 22px 0 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.status-summary { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; }
.status-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 100px; color: var(--muted); background: var(--surface); line-height: 1.3; }
.status-chip strong { margin-left: 3px; color: var(--text); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.status-chip[data-state=running] .status-dot { background: var(--success); }
.status-chip[data-state=starting] .status-dot, .status-chip[data-state=checking] .status-dot { background: var(--accent); }
.status-chip[data-state=unknown] .status-dot { background: var(--warning); }
.status-chip[data-state=disconnected] .status-dot { background: var(--error); }
.status-actions { display: flex; align-items: center; flex-shrink: 0; gap: 12px; }
.status-actions small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.refresh-button { width: 32px; height: 32px; padding: 7px; border-radius: 50%; background: transparent; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 220px; padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); transition: box-shadow .2s ease; }
.card:hover { box-shadow: var(--shadow-hover); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-right: 24px; }
.project-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 13px; background: var(--soft); font-size: 25px; line-height: 1; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
.icon-button:hover { color: var(--text); background: var(--soft); }
.edit { position: absolute; right: 12px; top: 27px; width: 28px; height: 30px; font-size: 21px; }
.run-badge { min-width: 0; border: 0; border-radius: 100px; padding: 5px 9px; color: var(--muted); background: var(--soft); font-size: 11px; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; transition: background .18s ease; }
.run-badge:hover { background: var(--hover); }
.run-badge[data-state=running] { color: var(--success); background: var(--success-soft); }
.run-badge[data-state=unknown] { color: var(--warning); background: var(--warning-soft); }
.card h2 { margin: 18px 0 22px; color: var(--text); font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -.35px; overflow-wrap: anywhere; }
.launch { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 44px; margin-top: auto; padding: 12px 16px; border: 0; border-radius: 12px; color: var(--accent-text); background: var(--accent-soft); font-size: 13px; font-weight: 550; line-height: 1.5; transition: background .18s ease; }
.launch:hover:not(:disabled) { background: var(--accent); color: #fff; }
.launch:disabled { color: var(--muted); background: var(--soft); }
.launch .action-icon { width: 14px; height: 14px; }
.lifecycle-actions { display: flex; gap: 8px; margin-top: 8px; }
.lifecycle-actions button { flex: 1; min-width: 0; min-height: 36px; padding: 8px 12px; font-size: 12px; border-radius: 10px; }
.notice { margin: 20px 0 0; padding: 12px 16px; border-radius: 12px; color: var(--text); background: var(--surface); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
.notice.error { color: var(--error); background: var(--error-soft); }
.empty { padding: 72px 24px; text-align: center; border: 1px dashed var(--line); border-radius: 24px; }
.empty-mark { width: 56px; height: 56px; }
.empty h2 { margin: 20px 0 10px; font-size: 24px; font-weight: 600; letter-spacing: -.5px; }
.empty p { margin: 0 0 24px; color: var(--muted); font-size: 13px; line-height: 1.7; }
footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.6; }
dialog { width: min(560px, calc(100% - 32px)); max-height: calc(100dvh - 48px); margin: auto; padding: 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); color: var(--text); box-shadow: 0 24px 80px #0003; }
dialog::backdrop { background: #0004; backdrop-filter: blur(8px); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
.dialog-head h2 { margin: 0; font-size: 23px; font-weight: 600; line-height: 1.3; letter-spacing: -.45px; overflow-wrap: anywhere; }
.dialog-head .icon-button { flex-shrink: 0; background: var(--soft); }
.name-row { display: flex; gap: 14px; }
.name-row .icon-field { flex: 0 0 68px; }
.name-row .icon-field input { text-align: center; font-size: 22px; padding: 7px; }
.name-row .name-field { flex: 1; min-width: 0; }
label { display: block; margin-bottom: 18px; color: var(--text); font-size: 12px; font-weight: 550; line-height: 1.6; }
input, textarea, select { display: block; width: 100%; min-height: 42px; margin-top: 7px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 13px; font-weight: 400; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
textarea { resize: vertical; }
label small, dialog > small { display: block; margin-top: 7px; color: var(--muted); font-size: 11px; font-weight: 400; line-height: 1.7; }
#cwd-hint { color: var(--muted); font-weight: 400; }
.icon-picker { min-width: 0; margin: 0 0 22px; padding: 0; border: 0; }
.icon-picker legend { margin-bottom: 10px; padding: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.icon-choices { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.icon-choice { min-width: 0; height: 42px; padding: 4px; border: 1px solid transparent; border-radius: 10px; background: var(--soft); font-size: 23px; transition: background .18s ease, border-color .18s ease; }
.icon-choice:hover { background: var(--hover); }
.icon-choice[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); }
dialog details { margin: 0 0 18px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 12px; }
dialog summary { cursor: pointer; color: var(--muted); font-weight: 500; line-height: 1.6; }
dialog details[open] summary { color: var(--text); }
dialog details label { margin: 12px 0 0; }
.dialog-actions { position: sticky; bottom: -28px; display: flex; align-items: center; gap: 8px; margin: 26px -28px -28px; padding: 18px 28px; border-top: 1px solid var(--line); background: var(--surface); }
.spacer { flex: 1; }
.dialog-actions button { font-size: 12px; padding: 10px 14px; }
.form-error { padding: 12px; border-radius: 10px; color: var(--error); background: var(--error-soft); font-size: 12px; line-height: 1.6; }
.detail-state { display: inline-block; margin: 0 0 10px; padding: 6px 10px; border-radius: 8px; color: var(--accent-text); background: var(--accent-soft); font-size: 13px; font-weight: 550; }
#status-detail, #status-suggestion { margin: 12px 0; font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
.detail-suggestion { color: var(--muted); }
#status-dialog > small { margin-top: 24px; }
#stop-explanation { margin: 12px 0; font-size: 13px; line-height: 1.8; }
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #161617; --surface: #222224; --text: #f5f5f7; --muted: #a1a1a6; --line: #353537;
  --soft: #2c2c2e; --hover: #38383a; --accent-text: #78b6ff; --accent-soft: #233348;
  --success: #7ddba0; --success-soft: #25392e; --warning: #e2b570; --warning-soft: #3b3224;
  --error: #ff9399; --error-soft: #3d262a; --shadow: 0 4px 24px #0000000c; --shadow-hover: 0 12px 32px #00000024;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    color-scheme: dark;
    --bg: #161617; --surface: #222224; --text: #f5f5f7; --muted: #a1a1a6; --line: #353537;
    --soft: #2c2c2e; --hover: #38383a; --accent-text: #78b6ff; --accent-soft: #233348;
    --success: #7ddba0; --success-soft: #25392e; --warning: #e2b570; --warning-soft: #3b3224;
    --error: #ff9399; --error-soft: #3d262a; --shadow: 0 4px 24px #0000000c; --shadow-hover: 0 12px 32px #00000024;
  }
}
@media (max-width: 760px) {
  .shell { padding: 32px 24px 24px; }
  .grid { gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .brand h1 { font-size: 23px; }
  .status-actions small { display: none; }
}
@media (max-width: 520px) {
  .shell { padding: 24px 20px; }
  .topbar { gap: 14px; }
  .brand { gap: 10px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; }
  .brand h1 { font-size: 20px; letter-spacing: -.4px; }
  .version { display: none; }
  .topbar .primary { padding: 10px 12px; font-size: 12px; }
  .status-bar { gap: 8px; margin: 22px 0 20px; padding-top: 18px; }
  .status-chip { gap: 5px; padding: 6px 9px; font-size: 11px; }
  .status-chip strong { margin-left: 1px; font-size: 11px; }
  .grid { grid-template-columns: 1fr; }
  .card { min-height: 200px; }
  dialog { max-height: calc(100dvh - 24px); padding: 22px; border-radius: 20px; }
  .dialog-head h2 { font-size: 21px; }
  .dialog-actions { bottom: -22px; flex-wrap: wrap; margin: 26px -22px -22px; padding: 16px 22px; }
  .dialog-actions .danger { padding-left: 0; }
  footer { margin-top: 28px; }
}
@media (max-width: 360px) {
  .shell { padding: 20px 16px; }
  .brand h1 { font-size: 18px; }
  .brand-mark { width: 30px; height: 30px; }
  .topbar .primary { gap: 4px; padding: 9px; }
  .topbar .action-icon { width: 14px; height: 14px; }
  .icon-choices { gap: 5px; }
  .dialog-actions button { padding: 9px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NiIgaGVpZ2h0PSI5NiIgdmlld0JveD0iMCAwIDk2IDk2Ij4KICA8cmVjdCB3aWR0aD0iOTYiIGhlaWdodD0iOTYiIHJ4PSIyNCIgZmlsbD0iI0Q5Rjk5RCIvPgogIDxyZWN0IHg9IjIwIiB5PSIyMCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNiIgZmlsbD0iIzI1MzAxRSIvPgogIDxyZWN0IHg9IjUyIiB5PSIyMCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNiIgZmlsbD0iIzI1MzAxRSIgb3BhY2l0eT0iLjY1Ii8+CiAgPHJlY3QgeD0iMjAiIHk9IjUyIiB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHJ4PSI2IiBmaWxsPSIjMjUzMDFFIiBvcGFjaXR5PSIuNjUiLz4KICA8cmVjdCB4PSI1MiIgeT0iNTIiIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgcng9IjYiIGZpbGw9IiMyNTMwMUUiLz4KICA8cGF0aCBkPSJNNjEgNTguNSA2OSA2NCA2MSA2OS41WiIgZmlsbD0iI0Q5Rjk5RCIvPgo8L3N2Zz4K" alt="" aria-hidden="true"><h1>项目启动台</h1><span id="version" class="version"></span></div>
      <button id="add" class="primary"><svg class="action-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>添加项目</span></button>
    </header>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div class="status-bar"><div id="running-summary" class="status-summary" role="status" aria-live="polite">正在检查…</div><div class="status-actions"><small id="checked-at">每 5 秒更新</small><button type="button" id="refresh" class="secondary refresh-button" aria-label="刷新状态" title="刷新状态"><svg class="action-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 8a6.3 6.3 0 0 0-10.6-3L3 7m0-4v4h4M4 12a6.3 6.3 0 0 0 10.6 3L17 13m-4 0h4v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
    <section id="grid" class="grid" aria-label="项目快捷入口"></section>
    <section id="empty" class="empty" hidden><img class="empty-mark" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NiIgaGVpZ2h0PSI5NiIgdmlld0JveD0iMCAwIDk2IDk2Ij4KICA8cmVjdCB3aWR0aD0iOTYiIGhlaWdodD0iOTYiIHJ4PSIyNCIgZmlsbD0iI0Q5Rjk5RCIvPgogIDxyZWN0IHg9IjIwIiB5PSIyMCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNiIgZmlsbD0iIzI1MzAxRSIvPgogIDxyZWN0IHg9IjUyIiB5PSIyMCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNiIgZmlsbD0iIzI1MzAxRSIgb3BhY2l0eT0iLjY1Ii8+CiAgPHJlY3QgeD0iMjAiIHk9IjUyIiB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHJ4PSI2IiBmaWxsPSIjMjUzMDFFIiBvcGFjaXR5PSIuNjUiLz4KICA8cmVjdCB4PSI1MiIgeT0iNTIiIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgcng9IjYiIGZpbGw9IiMyNTMwMUUiLz4KICA8cGF0aCBkPSJNNjEgNTguNSA2OSA2NCA2MSA2OS41WiIgZmlsbD0iI0Q5Rjk5RCIvPgo8L3N2Zz4K" alt="" aria-hidden="true"><h2>添加第一个项目</h2><p>填写已有的启动文件，或粘贴原来的 PowerShell 命令。</p><button id="first-add" class="primary">＋ 添加项目</button></section>
    <footer><span id="count">正在连接…</span><span>启动后在原终端或程序窗口中运行</span></footer>
  </main>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="form">
      <div class="dialog-head"><h2 id="dialog-title">添加项目</h2><button type="button" id="close" class="icon-button" aria-label="关闭编辑">×</button></div>
      <div class="name-row"><label class="icon-field">图标<input name="icon" aria-label="图标" maxlength="24" value="🚀"></label><label class="name-field">项目名称<input name="name" aria-label="项目名称" placeholder="例如：选题面板" maxlength="80" required></label></div>
      <fieldset class="icon-picker"><legend>选择图标，也可在上方输入自定义图标</legend><div id="icon-choices" class="icon-choices"></div></fieldset>
      <label>启动方式<select name="type" aria-label="启动方式"><option value="file">已有启动文件 / 快捷方式</option><option value="command">原有 PowerShell 命令</option></select></label>
      <label id="path-field">入口文件<input name="path" aria-label="入口文件" placeholder="E:\项目\启动.ps1" autocomplete="off"><small>支持 .ps1、.cmd、.bat、.lnk、.exe、.url</small></label>
      <label id="command-field" hidden>启动命令<textarea name="command" aria-label="启动命令" placeholder="npm run dev" rows="3"></textarea><small>粘贴你原来在 PowerShell 中使用的命令。</small></label>
